name: Build Resume

on:
  push:
    branches: [main]
    # only run when the resume source changes. this also stops the workflow
    # from retriggering itself, since its own commit only touches public/
    paths:
      - 'resume/**'
      - '.github/workflows/resume.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: compile latex resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: resume
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: publish to public
        run: cp resume/resume.pdf public/resume.pdf

      - name: commit updated resume
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # no [skip ci]: cloudflare honors it and would skip deploying the pdf
          commit_message: "build resume"
          file_pattern: public/resume.pdf
